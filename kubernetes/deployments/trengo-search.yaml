---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trengo-health-check
  namespace: default
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata: {}
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - "REPLICAS=$(kubectl get deployment trengo-search -n default -o jsonpath='{.status.availableReplicas}')\n\
              REPLICAS=${REPLICAS:-0}\n\nif [ \"$REPLICAS\" -eq 0 ]; then\n  echo\
              \ \"TrengoAppDown: trengo-search has 0 available replicas\"\n  TIMESTAMP=$(date\
              \ +%s%N)\n  curl -s -X POST http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push\
              \ \\\n    -H \"Content-Type: application/json\" \\\n    -d \"{\n   \
              \   \\\"streams\\\": [{\n        \\\"stream\\\": {\n          \\\"job\\\
              \": \\\"trengo-health-check\\\",\n          \\\"app\\\": \\\"trengo-search\\\
              \",\n          \\\"namespace\\\": \\\"default\\\",\n          \\\"severity\\\
              \": \\\"critical\\\"\n        },\n        \\\"values\\\": [[\n     \
              \     \\\"${TIMESTAMP}\\\",\n          \\\"level=error msg=TrengoAppDown\
              \ available_replicas=0 deployment=trengo-search namespace=default\\\"\
              \n        ]]\n      }]\n    }\"\n  echo \"Log pushed to Loki\"\nelse\n\
              \  echo \"trengo-search is healthy: ${REPLICAS} replica(s) available\"\
              \nfi\n"
            image: bitnami/kubectl:latest
            imagePullPolicy: Always
            name: health-check
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: trengo-health-check
          serviceAccountName: trengo-health-check
          terminationGracePeriodSeconds: 30
  schedule: '* * * * *'
  successfulJobsHistoryLimit: 3
  suspend: false

