---
# Cluster Drift Detection CronJob
#
# Runs every 5 minutes. Compares:
#   - Expected nodes: the kubeadm VMs on the hypervisor (virsh list --all,
#     names kubeadm-control and kubeadm-worker-N as created by terraform-kubeadm)
#   - The nodes registered in the cluster (Kubernetes API, in-cluster ServiceAccount)
#
# If a VM is running but not in the cluster, or registered but NotReady, it
# SSHes in, grabs the last kubelet log lines, and POSTs a ClusterDrift alert
# to the alertmanager-webhook which triggers Claude diagnosis and a Slack
# message with Approve/Dismiss buttons.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-checker
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drift-checker
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drift-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: drift-checker
subjects:
  - kind: ServiceAccount
    name: drift-checker
    namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drift-check-script
  namespace: monitoring
data:
  drift-check.py: |
    #!/usr/bin/env python3
    """
    Cluster drift detector.
    Compares the kubeadm VMs on the hypervisor (virsh) against the nodes
    registered in the cluster (Kubernetes API). Posts a ClusterDrift alert
    to alertmanager-webhook if anything is off.
    """
    import subprocess, json, urllib.request, ssl, sys, os, re

    SSH_KEY        = '/root/.ssh/id_rsa'
    SSH_KNOWN_HOSTS = os.environ.get('SSH_KNOWN_HOSTS', '')
    HYPERVISOR_IP  = os.environ['HYPERVISOR_IP']
    WEBHOOK_URL    = os.environ.get('WEBHOOK_URL', 'http://alertmanager-webhook:8080/')
    ALERTMANAGER_TOKEN = os.environ.get('ALERTMANAGER_TOKEN', '')
    VM_PATTERN     = re.compile(r'^kubeadm-(control|worker-\d+)$')

    SA_DIR = '/var/run/secrets/kubernetes.io/serviceaccount'

    def ssh(host, cmd, timeout=20):
        if SSH_KNOWN_HOSTS:
            hk = ['-o', 'StrictHostKeyChecking=yes', '-o', f'UserKnownHostsFile={SSH_KNOWN_HOSTS}']
        else:
            hk = ['-o', 'StrictHostKeyChecking=no', '-o', 'UserKnownHostsFile=/dev/null']
        try:
            r = subprocess.run(
                ['ssh', '-i', SSH_KEY, *hk, '-o', 'ConnectTimeout=10',
                 f'labadmin@{host}', cmd],
                capture_output=True, text=True, timeout=timeout
            )
            return (r.stdout + r.stderr).strip()
        except Exception as e:
            return f'(ssh error: {e})'

    def get_virsh_states():
        """Returns dict of {vm_name: 'running'|'shut off'|...} for the kubeadm VMs."""
        out = ssh(HYPERVISOR_IP, 'virsh list --all')
        if 'ssh error' in out or 'Connection refused' in out or not out.strip():
            print(f"WARNING: could not reach hypervisor via SSH: {out}", file=sys.stderr)
            return None   # None = hypervisor unreachable, distinct from empty
        states = {}
        for line in out.splitlines():
            # Lines look like: "  10   kubeadm-worker-2   running"
            # or:              "   -   kubeadm-worker-1   shut off"
            parts = line.strip().split()
            if len(parts) >= 3 and (parts[0].isdigit() or parts[0] == '-'):
                name  = parts[1]
                state = ' '.join(parts[2:])
                if VM_PATTERN.match(name):
                    states[name] = state
        return states

    def get_cluster_nodes():
        """Returns dict of {node_name: {'ready': bool, 'ip': str}} from the API."""
        host = os.environ['KUBERNETES_SERVICE_HOST']
        port = os.environ.get('KUBERNETES_SERVICE_PORT', '443')
        with open(f'{SA_DIR}/token') as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=f'{SA_DIR}/ca.crt')
        req = urllib.request.Request(
            f'https://{host}:{port}/api/v1/nodes',
            headers={'Authorization': f'Bearer {token}'},
        )
        with urllib.request.urlopen(req, timeout=15, context=ctx) as resp:
            items = json.loads(resp.read()).get('items', [])
        nodes = {}
        for item in items:
            name  = item['metadata']['name']
            ready = any(c.get('type') == 'Ready' and c.get('status') == 'True'
                        for c in item.get('status', {}).get('conditions', []))
            ip = next((a['address'] for a in item.get('status', {}).get('addresses', [])
                       if a.get('type') == 'InternalIP'), '')
            nodes[name] = {'ready': ready, 'ip': ip}
        return nodes

    def get_kubelet_error(ip):
        """Grab last meaningful error from the kubelet journal."""
        out = ssh(ip,
            'sudo journalctl -u kubelet --no-pager -n 5 2>/dev/null'
            ' | grep -i "error\\|fail\\|invalid" | tail -2'
        )
        return out.strip() or '(no recent errors found)'

    # ── Gather state ──────────────────────────────────────────────────────────
    drift          = []
    virsh_states   = get_virsh_states()
    cluster_nodes  = get_cluster_nodes()

    if virsh_states is None:
        print("Cannot reach hypervisor — skipping virsh checks, cluster-only check.")
        drift.append("`hypervisor` — SSH unreachable from drift-checker pod")
        virsh_states = {}

    # Expected = every kubeadm VM on the hypervisor plus every registered node.
    expected = set(virsh_states) | set(cluster_nodes)

    # ── Check each expected node ──────────────────────────────────────────────
    for name in sorted(expected):
        vm_state   = virsh_states.get(name, 'not found in virsh')
        in_cluster = name in cluster_nodes
        is_ready   = cluster_nodes.get(name, {}).get('ready', False)
        ip         = cluster_nodes.get(name, {}).get('ip', '')

        if virsh_states and 'not found' in vm_state:
            drift.append(f"`{name}` — registered in the cluster but no such VM in virsh")
            continue

        if 'shut off' in vm_state:
            drift.append(f"`{name}` — VM is shut off")
            continue

        # VM is running — check cluster membership
        if not in_cluster:
            drift.append(f"`{name}` — VM running but NOT in cluster (never joined or deleted)")
        elif not is_ready:
            err = get_kubelet_error(ip) if ip else '(node has no InternalIP)'
            drift.append(
                f"`{name}` ({ip}) — in cluster but NotReady.\n"
                f"  kubelet error: {err}"
            )

    # ── Report ────────────────────────────────────────────────────────────────
    if not drift:
        print("All nodes healthy — no drift detected.")
        sys.exit(0)

    description = '\n'.join(drift)
    summary     = f"{len(drift)} node(s) out of sync with expected cluster state"
    print(f"DRIFT DETECTED:\n{description}")

    alert_payload = json.dumps({
        "status": "firing",
        "alerts": [{
            "labels": {
                "alertname": "ClusterDrift",
                "severity":  "critical",
                "namespace": "kube-system",
            },
            "annotations": {
                "summary":     summary,
                "description": description,
            },
            "startsAt": __import__('datetime').datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
        }],
    }).encode()

    try:
        req = urllib.request.Request(
            WEBHOOK_URL, data=alert_payload,
            headers={'Content-Type': 'application/json',
                     'Authorization': f'Bearer {ALERTMANAGER_TOKEN}'},
            method='POST',
        )
        urllib.request.urlopen(req, timeout=10)
        print("Alert posted to webhook.")
    except Exception as e:
        print(f"Failed to post alert: {e}", file=sys.stderr)
        sys.exit(1)

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-drift-check
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: drift-checker
          restartPolicy: OnFailure
          containers:
            - name: checker
              image: alpine:3.19
              command: ["sh", "-c", "apk add --no-cache openssh-client python3 > /dev/null 2>&1 && python3 /scripts/drift-check.py"]
              envFrom:
                - configMapRef:
                    name: lab-network-config
              env:
                - name: WEBHOOK_URL
                  value: "http://alertmanager-webhook:8080/"
                - name: SSH_KNOWN_HOSTS
                  value: "/root/.ssh/known_hosts"
                # The webhook rejects unauthenticated POSTs; same Secret as the
                # alertmanager-webhook Deployment.
                - name: ALERTMANAGER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: alertmanager-token
                      key: token
              volumeMounts:
                - name: ssh-key
                  mountPath: /root/.ssh
                  readOnly: true
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          volumes:
            - name: ssh-key
              secret:
                secretName: webhook-ssh-key
                defaultMode: 0400
            - name: script
              configMap:
                name: drift-check-script
                defaultMode: 0755
