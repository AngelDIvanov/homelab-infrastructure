---
# Vaultwarden daily backup CronJob.
#
# What it does:
#   1. Copies the Vaultwarden SQLite database using sqlite3 .backup (safe hot copy)
#      straight from the NFS-backed vaultwarden-nfs claim mounted read-only
#   2. Stores timestamped backups on the NFS-backed vaultwarden-backups claim
#   3. Retains last 30 backups (~1 month)
#
# Restore:
#   1. Scale down vaultwarden: kubectl scale deploy vaultwarden -n vaultwarden --replicas=0
#   2. Copy backup to NFS: cp /data/backups/vaultwarden/<backup>.db /data/vaultwarden/db.sqlite3
#   3. Scale back up:       kubectl scale deploy vaultwarden -n vaultwarden --replicas=1

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-backups
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 2Gi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 2 * * *"        # Daily at 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # a small image that ships the sqlite3 CLI, so nothing is installed at run time
              image: keinos/sqlite3:3.50.4@sha256:7ea29f0c7e91a8c3f315e831459d07000f34e9e9b25fbc30be2e0481b3e0450f
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR=/data/backups/vaultwarden
                  mkdir -p "$BACKUP_DIR"

                  echo "[$(date)] Starting Vaultwarden backup..."
                  sqlite3 /vaultwarden/db.sqlite3 ".backup $BACKUP_DIR/vaultwarden-$TIMESTAMP.db"

                  SIZE=$(du -sh "$BACKUP_DIR/vaultwarden-$TIMESTAMP.db" | cut -f1)
                  echo "[$(date)] Backup saved: vaultwarden-$TIMESTAMP.db ($SIZE)"

                  # Keep last 30 backups
                  ls -t $BACKUP_DIR/vaultwarden-*.db 2>/dev/null | tail -n +31 | xargs -r rm -v

                  echo "[$(date)] Retained backups:"
                  ls -lh $BACKUP_DIR/
              volumeMounts:
                - name: vaultwarden-data
                  mountPath: /vaultwarden
                  readOnly: true
                - name: backup-storage
                  mountPath: /data/backups
          volumes:
            - name: vaultwarden-data
              persistentVolumeClaim:
                claimName: vaultwarden-nfs
            - name: backup-storage
              persistentVolumeClaim:
                claimName: vaultwarden-backups
