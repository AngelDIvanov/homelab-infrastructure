---
# Real etcd snapshots for the kubeadm cluster: etcdctl snapshot save against
# the local etcd listener on the control node, written to the NFS-backed
# etcd-snapshots claim every 12h; the 14 most recent snapshots are retained.
#
# The etcd client certificates live only on the control node, so the job is
# pinned there with hostNetwork and a read-only hostPath for the PKI.
#
# Restore procedure:
#   1. Move /etc/kubernetes/manifests/etcd.yaml aside (kubelet stops etcd)
#   2. ETCDCTL_API=3 etcdctl snapshot restore /backup/etcd-<date>.db \
#        --data-dir /var/lib/etcd-restore
#   3. Point the etcd static pod manifest at /var/lib/etcd-restore and move it
#      back into /etc/kubernetes/manifests

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-snapshots
  namespace: kube-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 5Gi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: kube-system
spec:
  schedule: "0 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          nodeName: kubeadm-control
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          hostNetwork: true
          restartPolicy: OnFailure
          containers:
            - name: snapshot
              image: registry.k8s.io/etcd:3.5.21-0
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%F-%H%M)
                  SNAPSHOT="/backup/etcd-${TIMESTAMP}.db"

                  echo "[$(date)] Starting etcd snapshot..."
                  etcdctl \
                    --endpoints=https://127.0.0.1:2379 \
                    --cacert=/etc/kubernetes/pki/etcd/ca.crt \
                    --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt \
                    --key=/etc/kubernetes/pki/etcd/healthcheck-client.key \
                    snapshot save "${SNAPSHOT}"

                  SIZE=$(du -sh "${SNAPSHOT}" | cut -f1)
                  echo "[$(date)] Snapshot saved: ${SNAPSHOT} (${SIZE})"

                  # Keep only the 14 most recent snapshots
                  ls -t /backup/etcd-*.db 2>/dev/null | tail -n +15 | xargs -r rm -v

                  echo "[$(date)] Retained snapshots:"
                  ls -lh /backup/etcd-*.db
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            - name: backup
              persistentVolumeClaim:
                claimName: etcd-snapshots
