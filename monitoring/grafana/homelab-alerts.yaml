apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    - name: homelab.rules
      rules:

        - alert: TrengoAppDown
          expr: kube_deployment_status_replicas_available{deployment="trengo-search"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Trengo app is completely down"
            description: "Deployment trengo-search has 0 available replicas for more than 30 seconds."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/applications/trengo-app-down.md"
            dashboard_url: "http://grafana.homelab.local/d/trengo"

        - alert: TrengoAppDegraded
          expr: kube_deployment_status_replicas_available{deployment="trengo-search"} < kube_deployment_spec_replicas{deployment="trengo-search"}
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Trengo app is degraded (fewer replicas than desired)"
            description: "Deployment trengo-search has fewer available replicas than desired for more than 2 minutes."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/applications/trengo-app-down.md"
            dashboard_url: "http://grafana.homelab.local/d/trengo"

        - alert: PodImagePullError
          expr: kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|ErrImageNeverPull"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod stuck on image pull error"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} cannot pull image ({{ $labels.reason }})."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/applications/pod-image-pull-error.md"
            dashboard_url: "http://grafana.homelab.local/d/k8s-pods"

        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod is crash-looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than 3 times in the last 15 minutes."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/applications/pod-crashloop.md"
            dashboard_url: "http://grafana.homelab.local/d/k8s-pods"

        - alert: NodeDiskHigh
          expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node disk usage is high"
            description: "Node {{ $labels.instance }} disk usage is above 75% (current: {{ $value | printf \"%.1f\" }}%)."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-disk-full.md"
            dashboard_url: "http://grafana.homelab.local/d/node-resources"

        - alert: NodeMemoryWarning
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is high"
            description: "Node {{ $labels.instance }} memory usage is above 80% (current: {{ $value | printf \"%.1f\" }}%). Monitor closely."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-memory-pressure.md"
            dashboard_url: "http://grafana.homelab.local/d/node-resources"

        - alert: NodeMemoryHigh
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 85
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Node memory usage is critical — auto-remediation triggered"
            description: "Node {{ $labels.instance }} memory usage is above 85% (current: {{ $value | printf \"%.1f\" }}%). Auto-restart initiated."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-memory-pressure.md"
            dashboard_url: "http://grafana.homelab.local/d/node-resources"

        - alert: NodeMemoryCritical
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Node memory critical — auto-remediation triggered"
            description: "Node {{ $labels.instance }} memory above 90% (current: {{ $value | printf \"%.1f\" }}%). Auto-restart initiated."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-memory-pressure.md"
            dashboard_url: "http://grafana.homelab.local/d/node-resources"

        - alert: NodeDiskCritical
          expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node disk usage is critical"
            description: "Node {{ $labels.instance }} disk usage is above 90% (current: {{ $value | printf \"%.1f\" }}%). Immediate action required."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-disk-full.md"
            dashboard_url: "http://grafana.homelab.local/d/node-resources"

        # WorkerNodeDown — informational alert for worker nodes going down.
        # The control-plane node is covered by ControlPlaneNodeNotReady below.
        - alert: WorkerNodeDown
          expr: kube_node_status_condition{condition="Ready",status="true",node!="kubeadm-control"} == 0
          for: 1m
          labels:
            severity: info
          annotations:
            summary: "Worker node is down — cluster is handling it"
            description: "Node *{{ $labels.node }}* is NotReady. Kubernetes has automatically rescheduled all workloads to healthy nodes. No immediate action required — please power the node back on when you get a chance."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/worker-node-not-ready.md"

        # ControlPlaneNodeNotReady — the single kubeadm control-plane node.
        - alert: ControlPlaneNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true",node="kubeadm-control"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "kubeadm-control node is not ready"
            description: "Node {{ $labels.node }} has been in a NotReady state for more than 2 minutes. The API server, etcd, scheduler and controller-manager run on this node."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/control-plane/api-server-down.md"

        - alert: ContainerOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1 and increase(kube_pod_container_status_restarts_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container was OOM killed"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) was OOM killed. Node memory pressure is a separate signal — a node at 60% can still OOM-kill containers with tight limits."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-memory-pressure.md"

        - alert: PVCPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PVC is stuck in Pending"
            description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} has been Pending for more than 5 minutes. Any pod depending on it cannot start."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/storage/pvc-pending.md"

        - alert: CronJobFailed
          expr: (kube_job_status_failed * on(namespace, job_name) group_left(owner_name) kube_job_owner{owner_kind="CronJob"}) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "CronJob has failed executions"
            description: "CronJob {{ $labels.owner_name }} in namespace {{ $labels.namespace }} has {{ $value }} failed job pod(s). Check logs for job {{ $labels.job_name }}."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/applications/pod-crashloop.md"

        - alert: NodeCPUHigh
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU usage is high"
            description: "Node {{ $labels.instance }} CPU usage is above 85% (current: {{ $value | printf \"%.1f\" }}%)."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-memory-pressure.md"
            dashboard_url: "http://grafana.homelab.local/d/node-resources"

        - alert: ContainerCPUThrottling
          expr: rate(container_cpu_throttled_seconds_total[5m]) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container is heavily CPU throttled"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) is throttled >50% of the time. CPU limit may be too low."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/nodes/node-memory-pressure.md"

        - alert: PVCUsageHigh
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC usage is high"
            description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value | printf \"%.1f\" }}% full."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/storage/pvc-pending.md"

        - alert: PVCUsageCritical
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PVC is almost full"
            description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value | printf \"%.1f\" }}% full. Immediate action required."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/storage/pvc-pending.md"

        - alert: LocalRegistryDown
          expr: probe_success{job="blackbox", instance=~".*30500.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Local Docker registry is unreachable"
            description: "The local registry at 192.168.122.240:30500 has been unreachable for 2+ minutes. New image pulls will fail across the cluster."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/applications/registry-down.md"

        - alert: EtcdSnapshotMissing
          expr: (time() - kube_cronjob_status_last_schedule_time{cronjob="etcd-snapshot", namespace="kube-system"}) > 46800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "etcd snapshot has not run in 13+ hours"
            description: "The etcd-snapshot CronJob last ran {{ $value | humanizeDuration }} ago (expected every 12h). Check: kubectl get cronjob etcd-snapshot -n kube-system"
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/control-plane/api-server-down.md"

        - alert: ControlPlaneUnhealthy
          expr: up{job="apiserver"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes control plane is unreachable"
            description: "The kube-apiserver scrape target has been down for 2+ minutes. The upstream KubeSchedulerDown, KubeControllerManagerDown and etcd rules cover the other control-plane components on the kubeadm node."
            runbook_url: "https://github.com/AngelDIvanov/homelab-infrastructure/blob/main/docs/runbooks/control-plane/api-server-down.md"
            dashboard_url: "http://grafana.homelab.local/d/k8s-cluster"
