---
# ============================================================
#  Silence noisy / false-positive upstream rules
#  These override upstream kube-prometheus-stack rules by
#  redefining them with expr: "false" so they never fire.
# ============================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-silences
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    - name: homelab-silences
      rules:
        - alert: Watchdog
          expr: "false"
          labels:
            severity: none
          annotations:
            summary: "Silenced — Watchdog is a heartbeat, not a real alert"

        - alert: KubeDaemonSetRolloutStuck
          expr: "false"
          labels:
            severity: none
          annotations:
            summary: "Silenced — fires during normal rolling updates"

        - alert: KubeDaemonSetMisScheduled
          expr: "false"
          labels:
            severity: none
          annotations:
            summary: "Silenced — node taints cause expected mis-scheduling"

        - alert: AlertmanagerFailedToSendAlerts
          expr: "false"
          labels:
            severity: none
          annotations:
            summary: "Silenced — transient webhook errors are covered by the webhook runbook"
