---
- name: Prepare every kubeadm node
  hosts: kubeadm_all
  become: true
  tags: [common]
  roles:
    - role: k8s_common

- name: Initialise the control plane
  hosts: kubeadm_control
  become: true
  tags: [control]
  roles:
    - role: k8s_control

- name: Join the workers
  hosts: kubeadm_workers
  become: true
  serial: 1
  tags: [workers]
  roles:
    - role: k8s_worker
