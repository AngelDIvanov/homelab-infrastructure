---
- name: Create the workload manifest directory
  ansible.builtin.file:
    path: "{{ k8s_workloads_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the helm chart repositories
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
    state: present
  loop:
    - name: prometheus-community
      url: https://prometheus-community.github.io/helm-charts
    - name: grafana
      url: https://grafana.github.io/helm-charts
    - name: portainer
      url: https://portainer.github.io/k8s
