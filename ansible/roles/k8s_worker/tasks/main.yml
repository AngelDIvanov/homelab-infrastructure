---
- name: Create a join command when the control play did not run in this invocation
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command --ttl {{ k8s_worker_join_token_ttl }}
  delegate_to: "{{ groups['kubeadm_control'][0] }}"
  register: k8s_worker_join
  changed_when: true
  no_log: true
  when: hostvars[groups['kubeadm_control'][0]].kubeadm_join_command is not defined

- name: Select the join command for this node
  ansible.builtin.set_fact:
    k8s_worker_join_command: >-
      {{ hostvars[groups['kubeadm_control'][0]].kubeadm_join_command
         | default(k8s_worker_join.stdout | default('')) }}
  no_log: true

- name: Join the node to the cluster
  ansible.builtin.command:
    cmd: "{{ k8s_worker_join_command }} --node-name {{ inventory_hostname }}"
    creates: /etc/kubernetes/kubelet.conf
  no_log: true

- name: Wait for the worker node to report Ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_worker_kubeconfig }}"
    kind: Node
    name: "{{ inventory_hostname }}"
  delegate_to: "{{ groups['kubeadm_control'][0] }}"
  register: k8s_worker_node
  until:
    - k8s_worker_node.resources is defined
    - k8s_worker_node.resources | length > 0
    - >-
      k8s_worker_node.resources[0].status.conditions | default([], true)
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status') | list | join == 'True'
  retries: "{{ k8s_worker_ready_retries }}"
  delay: "{{ k8s_worker_ready_delay }}"
