[all:vars]
ansible_user=labadmin
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ inventory_dir }}/known_hosts-k3s'

[control_plane]
k3s-control ansible_host=192.168.122.218

[infra]
k3s-infra ansible_host=192.168.122.230

[workers]
k3s-worker-1 ansible_host=192.168.122.219
k3s-worker-2 ansible_host=192.168.122.221

[ci_cd]
ci-runner ansible_host=192.168.122.220

[k8s_cluster:children]
control_plane
workers
