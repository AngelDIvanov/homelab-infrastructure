# Machines outside the kubeadm cluster. The Kubernetes nodes are in
# kubeadm.ini (generated by terraform). Host keys are pinned in known_hosts
# by scripts/kubeadm-known-hosts.sh, which reads both inventories.
[all:vars]
ansible_user=labadmin
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ inventory_dir }}/known_hosts'

# NFS server (/data) and GitLab CE. The libvirt VM is still named k3s-infra.
[infra]
infra ansible_host=192.168.122.230 vm_name=k3s-infra

[ci_cd]
ci-runner ansible_host=192.168.122.220 vm_name=ci-runner
